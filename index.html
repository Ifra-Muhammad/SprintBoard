
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SprintBoard Project Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">

        <!-- Navbar -->
        <header class="navbar">
            <div class="logo">
                <h2>SprintBoard</h2>
            </div>

            <nav class="nav-links" aria-label="Main navigation">
                <a href="#dashboard">Dashboard</a>
                <a href="#board">My Board</a>
            </nav>

            <button type="button" class="add-task-btn" id="addTaskBtn">
                + Add Task
            </button>
        </header>

        <main id="dashboard">

            <!-- Dashboard heading -->
            <section class="dashboard-header">
                <div>
                    <h1>Project Dashboard</h1>
                    <p>Manage your tasks and track your progress.</p>
                </div>

                <div class="date-display">
                    <span>November 2026</span>
                </div>
            </section>

            <!-- Statistics -->
            <section class="stats-container">

                <div class="stat-card">
                    <h3>Total Tasks</h3>
                    <p id="totalTasks">0</p>
                </div>

                <div class="stat-card">
                    <h3>To Do</h3>
                    <p id="todoCount">0</p>
                </div>

                <div class="stat-card">
                    <h3>In Progress</h3>
                    <p id="progressCount">0</p>
                </div>

                <div class="stat-card">
                    <h3>Completed</h3>
                    <p id="doneCount">0</p>
                </div>

            </section>

            <!-- Search and filter -->
            <section class="board-controls">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search tasks..."
                    aria-label="Search tasks by title or description"
                >

                <select
                    id="priorityFilter"
                    aria-label="Filter tasks by priority"
                >
                    <option value="all">All Priorities</option>
                    <option value="high">High Priority</option>
                    <option value="medium">Medium Priority</option>
                    <option value="low">Low Priority</option>
                </select>

                <button type="button" id="resetFilters">
                    Reset Filters
                </button>

            </section>

            <!-- Kanban board -->
            <section
                class="kanban-board"
                id="board"
                aria-label="Task board"
            >

                <!-- To Do -->
                <div class="board-column" id="todoColumn">
                    <div class="column-header">
                        <h2>To Do</h2>
                        <span id="todoBadge">0</span>
                    </div>

                    <div class="task-list" id="todoList"></div>
                </div>

                <!-- In Progress -->
                <div class="board-column" id="progressColumn">
                    <div class="column-header">
                        <h2>In Progress</h2>
                        <span id="progressBadge">0</span>
                    </div>

                    <div class="task-list" id="progressList"></div>
                </div>

                <!-- Done -->
                <div class="board-column" id="doneColumn">
                    <div class="column-header">
                        <h2>Done</h2>
                        <span id="doneBadge">0</span>
                    </div>

                    <div class="task-list" id="doneList"></div>
                </div>

            </section>

        </main>

        <!-- Add/Edit Task Modal -->
        <div class="modal" id="taskModal" aria-hidden="true">

            <div
                class="modal-content"
                role="dialog"
                aria-modal="true"
                aria-labelledby="modalTitle"
            >

                <div class="modal-header">
                    <h2 id="modalTitle">Add New Task</h2>

                    <button
                        type="button"
                        class="close-modal"
                        id="closeModalBtn"
                        aria-label="Close"
                    >
                        &times;
                    </button>
                </div>

                <form id="taskForm">

                    <input type="hidden" id="taskId">

                    <div class="form-group">
                        <label for="taskTitle">Task Title *</label>
                        <input
                            type="text"
                            id="taskTitle"
                            placeholder="Enter task title"
                            required
                        >
                        <small class="error-message" id="titleError"></small>
                    </div>

                    <div class="form-group">
                        <label for="taskDescription">Description</label>
                        <textarea
                            id="taskDescription"
                            placeholder="Enter task description"
                            rows="3"
                        ></textarea>
                    </div>

                    <div class="form-group">
                        <label for="taskPriority">Priority *</label>
                        <select id="taskPriority" required>
                            <option value="">Select Priority</option>
                            <option value="high">High</option>
                            <option value="medium">Medium</option>
                            <option value="low">Low</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="taskDueDate">Due Date *</label>
                        <input type="date" id="taskDueDate" required>
                    </div>

                    <div class="form-group">
                        <label for="taskStatus">Status *</label>
                        <select id="taskStatus" required>
                            <option value="todo">To Do</option>
                            <option value="progress">In Progress</option>
                            <option value="done">Done</option>
                        </select>
                    </div>

                    <div class="modal-actions">
                        <button type="button" id="cancelTaskBtn">
                            Cancel
                        </button>

                        <button type="submit" id="saveTaskBtn">
                            Save Task
                        </button>
                    </div>

                </form>

            </div>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <p>© 2026 SprintBoard.</p>
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
